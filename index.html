<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 780px;
            background: #20333d;
            border-radius: 38px;
            padding: 55px 45px 50px;
        }

        h1 {
            text-align: center;
            color: #18b894;
            font-size: 58px;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: white;
            font-size: 24px;
            margin-bottom: 35px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            height: 75px;
            border: none;
            outline: none;
            background: white;
            border-radius: 18px;
            padding: 0 22px;
            font-size: 22px;
            color: #222;
        }

        input::placeholder {
            color: #777;
        }

        button {
            width: 100%;
            height: 75px;
            border: none;
            border-radius: 18px;
            background: #18b894;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #13a681;
        }

        /* Success Popup */
        .popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 9999;
        }

        .popup-box {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .success-icon {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 50%;
            background: #18b894;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin-bottom: 20px;
        }

        .popup-box h2 {
            color: #20333d;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .popup-box p {
            color: #666;
            font-size: 17px;
            margin-bottom: 25px;
        }

        .close-btn {
            background: #18b894;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px 30px;
            font-size: 18px;
            cursor: pointer;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .register-box {
                padding: 35px 20px;
                border-radius: 25px;
            }

            h1 {
                font-size: 42px;
            }

            .subtitle {
                font-size: 18px;
                line-height: 1.4;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            input {
                height: 65px;
                font-size: 18px;
            }

            button {
                height: 65px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>Register</h1>

        <div class="subtitle">
            Signup now and get full access to our app.
        </div>

        <form
            id="registerForm"
            action="https://docs.google.com/forms/d/e/1FAIpQLSc_yTuy2p0HEdNECIN5x85HHVdjAqNwKOF2SJdBOjXRMYcplg/formResponse"
            method="POST"
            target="hidden_iframe"
            onsubmit="submitted()"
        >

            <!-- Firstname + Lastname -->
            <div class="row">

                <div class="input-group">
                    <input
                        type="text"
                        name="entry.1249404095"
                        placeholder="Firstname"
                        required
                    >
                </div>

                <div class="input-group">
                    <input
                        type="text"
                        name="entry.552375352"
                        placeholder="Lastname"
                        required
                    >
                </div>

            </div>

            <!-- Email -->
            <div class="input-group">
                <input
                    type="email"
                    name="entry.1990956343"
                    placeholder="Email"
                    required
                >
            </div>

            <!-- Submit -->
            <button type="submit">
                Submit
            </button>

        </form>

    </div>


    <!-- Hidden iframe -->
    <iframe
        name="hidden_iframe"
        id="hidden_iframe"
        style="display:none;"
    ></iframe>


    <!-- Success Popup -->
    <div class="popup" id="successPopup">

        <div class="popup-box">

            <div class="success-icon">
                ✓
            </div>

            <h2>Registration Successful!</h2>

            <p>
                Thank you for registering.
            </p>

            <button
                class="close-btn"
                onclick="closePopup()"
            >
                OK
            </button>

        </div>

    </div>


    <script>

        function submitted() {

            setTimeout(function() {

                document.getElementById("successPopup").style.display = "flex";

                document.getElementById("registerForm").reset();

            }, 700);

        }


        function closePopup() {

            document.getElementById("successPopup").style.display = "none";

        }

    </script>

</body>
</html>
